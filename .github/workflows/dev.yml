name: DEV - Artifact-First Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: book-shop
        run: |
          pip install -r requirements.txt

      - name: Collect static files
        working-directory: book-shop
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ALLOWED_HOSTS: localhost
        run: |
          python manage.py collectstatic --noinput

      - name: Build artifact
        working-directory: book-shop
        run: |
          mkdir -p artifacts
          ARTIFACT_NAME="app-${{ github.sha }}.tar.gz"
          tar -czf artifacts/${ARTIFACT_NAME} \
            --exclude='.git' \
            --exclude='artifacts' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='db.sqlite3' \
            .
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

      - name: Commit artifact to repo
        working-directory: book-shop
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add artifacts/
          git commit -m "ci: add artifact ${{ env.ARTIFACT_NAME }} [skip ci]"
          git push

      - name: Build Docker image from artifact
        working-directory: book-shop
        run: |
          docker build \
            --build-arg ARTIFACT_NAME=${{ env.ARTIFACT_NAME }} \
            -t ${{ vars.REGISTRY_NAME }}/${{ vars.IMAGE_NAME }}:dev-${{ github.sha }} \
            -t ${{ vars.REGISTRY_NAME }}/${{ vars.IMAGE_NAME }}:dev-latest \
            .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ vars.REGISTRY_NAME }}/${{ vars.IMAGE_NAME }}:dev-${{ github.sha }}
          docker push ${{ vars.REGISTRY_NAME }}/${{ vars.IMAGE_NAME }}:dev-latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/deployments/dev
            cat > ~/deployments/dev/.env << EOF
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            ALLOWED_HOSTS=${{ vars.EC2_HOST }},localhost
            REGISTRY_NAME=${{ vars.REGISTRY_NAME }}
            IMAGE_NAME=${{ vars.IMAGE_NAME }}
            IMAGE_VERSION=dev-latest
            EOF

            cat > ~/deployments/dev/docker-compose.yml << 'COMPOSE'
            version: '3.9'
            services:
              backend:
                image: ${REGISTRY_NAME}/${IMAGE_NAME}:${IMAGE_VERSION}
                env_file: .env
                volumes:
                  - static_volume:/app/staticfiles
                depends_on:
                  - db
                networks:
                  - bookshop_net
              db:
                image: postgres:15
                env_file: .env
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - bookshop_net
              nginx:
                image: nginx:alpine
                ports:
                  - "8000:80"
                volumes:
                  - ./nginx.conf:/etc/nginx/conf.d/default.conf
                  - static_volume:/app/staticfiles
                depends_on:
                  - backend
                networks:
                  - bookshop_net
            volumes:
              postgres_data:
              static_volume:
            networks:
              bookshop_net:
                driver: bridge
            COMPOSE

            cat > ~/deployments/dev/nginx.conf << 'NGINX'
            upstream django {
                server backend:8000;
            }
            server {
                listen 80;
                location / {
                    proxy_pass http://django;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
                location /static/ {
                    alias /app/staticfiles/;
                }
            }
            NGINX

            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            cd ~/deployments/dev
            docker compose -p dev down
            docker compose -p dev pull
            docker compose -p dev up -d
