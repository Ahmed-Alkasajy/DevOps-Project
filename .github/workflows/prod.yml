name: PROD - Promotion Only Pipeline

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/deployments/prod
            cat > ~/deployments/prod/.env << EOF
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            ALLOWED_HOSTS=${{ vars.EC2_HOST }},localhost
            REGISTRY_NAME=${{ vars.REGISTRY_NAME }}
            IMAGE_NAME=${{ vars.IMAGE_NAME }}
            IMAGE_VERSION=${{ vars.IMAGE_VERSION }}
            EOF

            cat > ~/deployments/prod/docker-compose.yml << 'COMPOSE'
            version: '3.9'
            services:
              backend:
                image: ${REGISTRY_NAME}/${IMAGE_NAME}:${IMAGE_VERSION}
                env_file: .env
                volumes:
                  - static_volume:/app/staticfiles
                depends_on:
                  - db
                networks:
                  - bookshop_net
              db:
                image: postgres:15
                env_file: .env
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - bookshop_net
              nginx:
                image: nginx:alpine
                ports:
                  - "8002:80"
                volumes:
                  - ./nginx.conf:/etc/nginx/conf.d/default.conf
                  - static_volume:/app/staticfiles
                depends_on:
                  - backend
                networks:
                  - bookshop_net
            volumes:
              postgres_data:
              static_volume:
            networks:
              bookshop_net:
                driver: bridge
            COMPOSE

            cat > ~/deployments/prod/nginx.conf << 'NGINX'
            upstream django {
                server backend:8000;
            }
            server {
                listen 80;
                location / {
                    proxy_pass http://django;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
                location /static/ {
                    alias /app/staticfiles/;
                }
            }
            NGINX

            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            cd ~/deployments/prod
            docker compose -p prod down
            docker compose -p prod pull
            docker compose -p prod up -d
