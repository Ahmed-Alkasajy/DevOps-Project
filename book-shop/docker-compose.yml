version: '3.9'

services:
  backend:
    build: .
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - db
    networks:
      - bookshop_net

  db:
    image: postgres:15
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookshop_net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - backend
    networks:
      - bookshop_net

volumes:
  postgres_data:
  static_volume:

networks:
  bookshop_net:
    driver: bridge